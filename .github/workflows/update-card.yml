name: Atualizar card do perfil

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia às 06:00 UTC
  workflow_dispatch:       # botão "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar SVG
        env:
          GH_USER: thallesgsrv
          # Para contar contribuições privadas, crie um PAT (read:user) e salve como
          # secret PROFILE_TOKEN; sem ele, usa o token padrão (só contribuições públicas).
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python generate.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-card.svg
          git diff --cached --quiet || git commit -m "chore: atualizar card do perfil"
          git push
