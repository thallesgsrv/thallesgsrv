name: Atualizar perfil

on:
  schedule:
    - cron: "0 6 * * *"        # todo dia às 03h (horário de Brasília)
  workflow_dispatch:            # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths: [generate.py, ascii.txt]

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar SVGs e README
        env:
          GH_USER: ${{ github.repository_owner }}
          # Opcional: crie um segredo PROFILE_TOKEN (PAT com read:user) para contar contribuições privadas.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python generate.py

      - name: Commitar mudanças
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: atualiza perfil [skip ci]"
          git push